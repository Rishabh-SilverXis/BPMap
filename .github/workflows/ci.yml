# CI (Architecture §20): typecheck → unit/golden tests → production build → e2e incl. the
# network-privacy test. Runs on every push and pull request. Nothing here deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (no browser download; e2e uses the runner's Google Chrome)
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and golden-file tests
        run: npm test
      - name: Secret scan of the production bundle
        run: |
          npm run build
          if grep -rEn "AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY" apps/web/dist; then
            echo "::error::Possible secret in the client bundle"; exit 1
          fi
      - name: End-to-end tests (incl. network privacy)
        run: npm run e2e
        env:
          CI: 'true'
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
